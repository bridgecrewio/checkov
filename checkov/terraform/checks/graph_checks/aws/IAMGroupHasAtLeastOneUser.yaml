metadata:
  id: "CKV2_AWS_14"
  name: "Ensure that IAM groups includes at least one IAM user"
  category: "IAM"
definition:
  or:
    - and:
        - cond_type: filter
          attribute: resource_type
          value:
            - aws_iam_group
          operator: within
        - cond_type: connection
          resource_types:
            - aws_iam_group
          connected_resource_types:
            - aws_iam_group_membership
          operator: exists
        - cond_type: attribute
          resource_types:
            - aws_iam_group_membership
          attribute: users
          operator: length_greater_than
          value: 0
    - and:
        - cond_type: filter
          attribute: resource_type
          value:
            - aws_iam_group
          operator: within
        - cond_type: connection
          resource_types:
            - aws_iam_group
          connected_resource_types:
            - aws_iam_user_group_membership
          operator: exists
