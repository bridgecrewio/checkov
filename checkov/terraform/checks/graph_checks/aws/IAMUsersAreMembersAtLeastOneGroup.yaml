metadata:
  id: "CKV2_AWS_21"
  name: "Ensure that all IAM users are members of at least one IAM group."
  category: "IAM"
definition:
  or:
    - and:
        - cond_type: filter
          attribute: resource_type
          value:
            - aws_iam_user
          operator: within
        - cond_type: connection
          resource_types:
            - aws_iam_user
          connected_resource_types:
            - aws_iam_group_membership
          operator: exists
    - and:
        - cond_type: filter
          attribute: resource_type
          value:
            - aws_iam_user
          operator: within
        - cond_type: connection
          resource_types:
            - aws_iam_user
          connected_resource_types:
            - aws_iam_user_group_membership
          operator: exists
