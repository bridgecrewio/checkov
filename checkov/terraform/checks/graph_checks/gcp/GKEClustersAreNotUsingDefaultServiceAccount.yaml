metadata:
  id: "CKV2_GCP_1"
  name: "Ensure GKE clusters are not running using the Compute Engine default service account "
  category: "NETWORKING"
definition:
  and:
    - or:
        - and:
            - cond_type: filter
              attribute: resource_type
              value:
                - google_container_cluster
              operator: within
            - cond_type: attribute
              resource_types:
                - google_container_cluster
              attribute: node_config.*.service_account
              operator: exists
            - cond_type: attribute
              resource_types:
                - google_container_cluster
              attribute: node_config.*.service_account
              operator: not_regex_match
              value: '.*-compute@developer\.gserviceaccount\.com$'
        - and:
            - cond_type: filter
              attribute: resource_type
              value:
                - google_container_cluster
              operator: within
            - cond_type: attribute
              resource_types:
                - google_container_cluster
              attribute: remove_default_node_pool
              operator: equals
              value: true
        - and:
            - cond_type: filter
              attribute: resource_type
              value:
                - google_container_node_pool
              operator: within
            - cond_type: attribute
              resource_types:
                - google_container_node_pool
              attribute: node_config.*.service_account
              operator: exists
            - cond_type: attribute
              resource_types:
                - google_container_node_pool
              attribute: node_config.*.service_account
              operator: not_regex_match
              value: '.*-compute@developer\.gserviceaccount\.com$'
    - or:
        - and:
            - cond_type: filter
              attribute: resource_type
              value:
                - google_container_node_pool
              operator: within
            - resource_types:
                - google_container_node_pool
              connected_resource_types:
                - google_project_default_service_accounts
              operator: not_exists
              cond_type: connection
        - and:
            - cond_type: filter
              attribute: resource_type
              value:
                - google_container_cluster
              operator: within
            - or:
                - resource_types:
                    - google_container_cluster
                  connected_resource_types:
                    - google_project_default_service_accounts
                  operator: not_exists
                  cond_type: connection
                - cond_type: attribute
                  resource_types:
                    - google_container_cluster
                  attribute: remove_default_node_pool
                  operator: equals
                  value: true
