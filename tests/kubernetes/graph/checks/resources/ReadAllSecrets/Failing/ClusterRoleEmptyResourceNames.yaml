apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: empty-secret-reader
  namespace: my-namespace
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: []
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: empty-secrets-binding
  namespace: my-namespace
subjects:
- kind: ServiceAccount
  name: my-service-account
roleRef:
  kind: ClusterRole
  name: empty-secret-reader
  apiGroup: rbac.authorization.k8s.io
