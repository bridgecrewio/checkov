apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mixed-secret-reader
rules:
- apiGroups:
    - ""
  resources:
    - "secrets"
  verbs:
    - "get"
    - "watch"
    - "list"
- apiGroups:
    - ""
  resources:
    - "secrets"
  resourceNames:
    - "pull-secret"
  verbs:
    - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mixed-secrets-global
subjects:
- kind: ServiceAccount
  name: sa1
roleRef:
  kind: ClusterRole
  name: mixed-secret-reader
  apiGroup: rbac.authorization.k8s.io
