apiVersion: v1
kind: ServiceAccount
metadata:
  name: {service_account}
---
apiVersion: v1
kind: Pod
metadata:
  name: placeholder-pod
spec:
  serviceAccountName: {service_account}
  containers:
  - name: webserver
    image: nginx:latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: real-sa
---
apiVersion: v1
kind: Pod
metadata:
  name: real-pod
spec:
  serviceAccountName: real-sa
  containers:
  - name: webserver
    image: nginx:latest
