apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pod
  namespace: default
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
        tier: worker
    spec:
      containers:
        - name: demo
          image: nginx:1.27
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pod
  namespace: default
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
        tier: api
    spec:
      containers:
        - name: demo
          image: nginx:1.27
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-workers
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: demo
    matchExpressions:
      - key: tier
        operator: In
        values:
          - worker
  policyTypes:
    - Ingress
